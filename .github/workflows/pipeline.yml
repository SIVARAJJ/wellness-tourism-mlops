
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Register Dataset
        run: python model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: data/tourism.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Data Preparation
        run: python model_building/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: .

      - name: Start MLflow Server
        run: |
          mlflow server --host 127.0.0.1 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlartifacts > mlflow.log 2>&1 &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/health; then
              echo "MLflow server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MLflow server failed to start"
          cat mlflow.log
          exit 1

      - name: Model Building
        run: python model_building/train.py
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000

      
      - name: Upload MLflow Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-logs
          path: |
            mlflow.db
            mlartifacts/
            mlflow.log
          if-no-files-found: ignore


      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/best_model.joblib
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push
